# The lab app for CardSheetKit: every option behind a settings button, and the UI tests that drive
# the real gestures. Generate the project with `xcodegen generate` (brew install xcodegen).
name: CardSheetLab
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  Components:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CardSheetLab:
    type: application
    platform: iOS
    sources: [CardSheetLab]
    dependencies:
      - package: Components
        product: CardSheetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CardSheetLab
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Card Sheet Lab
  CardSheetLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CardSheetLabUITests]
    dependencies:
      - target: CardSheetLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CardSheetLabUITests
        TEST_TARGET_NAME: CardSheetLab
schemes:
  CardSheetLab:
    build:
      targets:
        CardSheetLab: all
        CardSheetLabUITests: [test]
    test:
      targets: [CardSheetLabUITests]
